name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Unit Tests
      run: |
        python test_app.py

    - name: Build Docker Image
      run: |
        docker build -t studentapp:${{ github.sha }} .
        docker tag studentapp:${{ github.sha }} studentapp:latest

    - name: Test Docker Container Run & Health Check
      run: |
        docker run -d -p 5000:5000 --name test-container studentapp:latest
        sleep 3
        curl -f http://localhost:5000/health || exit 1
        docker stop test-container
