apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentapp-deployment
  labels:
    app: studentapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studentapp
  template:
    metadata:
      labels:
        app: studentapp
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: studentapp
        image: 971023774760.dkr.ecr.ap-south-1.amazonaws.com/assigment5-repo:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
